name: Practice tasks
on: push
jobs:
    test:
      runs-on: ubuntu-latest
      steps:
      - name: Download the code
        uses: actions/checkout@v7
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: NodeJS linting
        run: npm run lint
      - name: Test NPM
        run: npm test

    deploy:
      needs: test
      runs-on: ubuntu-latest
      steps:
      - name: Deploy project
        run: echo "Deploy code ..."